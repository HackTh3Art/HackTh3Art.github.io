# HackTheArt Events
# Format for each event:
# - id: unique identifier (used for UID in ICS)
# - title: event name
# - start: local start time (ISO 8601, for display in calendar)
# - end: local end time (ISO 8601, for display in calendar)
# - start_utc: UTC start time (ISO 8601 with Z suffix, for ICS feed)
# - end_utc: UTC end time (ISO 8601 with Z suffix, for ICS feed)
# - location: event location
# - description: event description

